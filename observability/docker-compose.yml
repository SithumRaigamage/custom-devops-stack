# Observability for the stack: container metrics (cAdvisor → Prometheus → Grafana)
# and central logs (Promtail → Loki → Grafana). Everything binds to 127.0.0.1.
#
#   make observability-up      Grafana  http://localhost:3002  (admin / see .env)
#                              Prometheus http://localhost:9090
name: observability

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: obs-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [observability, devops-network]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: obs-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      # Docker Desktop only passes the socket through when the socket file itself is
      # mounted; mounting all of /var/run leaves cAdvisor unable to see any containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  loki:
    image: grafana/loki:3.3.2
    container_name: obs-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  promtail:
    image: grafana/promtail:3.3.2
    container_name: obs-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }

  grafana:
    image: grafana/grafana:11.4.0
    container_name: obs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in observability/.env (copy .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3002
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  observability:
    name: observability
  # Shared with Jenkins/SonarQube so Prometheus can scrape them by container name.
  devops-network:
    name: devops-network
    external: true
