name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    name: Typecheck and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stackpilot
          POSTGRES_PASSWORD: stackpilot
          POSTGRES_DB: stackpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackpilot -d stackpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://stackpilot:stackpilot@127.0.0.1:5432/stackpilot
      SESSION_SECRET: ci-session-secret-ci-session-secret-1234

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and database tests
        run: pnpm test:all
