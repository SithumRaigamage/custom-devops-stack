# Mailpit: a local mail catcher. Apps in this lab send email to SMTP port 1025;
# nothing leaves the Mac, and every message shows up in the web inbox.
# First users: JobTrigger backend (password reset, billing notices) and Jenkins
# (email-ext notifications, SMTP host `stack-mailpit` port 1025 on devops-network).
#
#   make up S=mailpit      inbox http://localhost:8025   SMTP localhost:1025
name: mailpit

services:
  mailpit:
    image: axllent/mailpit:v1.29.2
    container_name: stack-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-1000}
      # Accept any SMTP login so apps can use the same auth code as in production.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      TZ: ${TZ:-UTC}
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [devops-network]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }

networks:
  devops-network:
    name: devops-network
    driver: bridge
