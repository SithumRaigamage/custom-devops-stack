services:
  postgres:
    image: postgres:16-alpine
    container_name: stackpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackpilot}
      POSTGRES_DB: ${POSTGRES_DB:-stackpilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stackpilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stackpilot} -d ${POSTGRES_DB:-stackpilot}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stackpilot-pgdata:
