services:
  sonarqube:
    image: sonarqube:26.1.0.118079-community
    container_name: sonarqube
    restart: unless-stopped

    ports:
      - "9000:9000"

    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:?Set SONARQUBE_DB_PASSWORD in sonarqube/.env (see .env.example)}
      SONAR_WEB_JAVAOPTS: "-Xmx1G -Xms1G"
      SONAR_CE_JAVAOPTS: "-Xmx1G -Xms1G"
      SONAR_SEARCH_JAVAOPTS: "-Xmx2G -Xms2G -Des.cluster.routing.allocation.disk.threshold_enabled=false"

    volumes:
      - ./data:/opt/sonarqube/data
      - ./extensions:/opt/sonarqube/extensions
      - ./logs:/opt/sonarqube/logs
      - ./temp:/opt/sonarqube/temp

    networks:
      - devops-network

    depends_on:
      - sonarqube-db

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G

  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:?Set SONARQUBE_DB_PASSWORD in sonarqube/.env (see .env.example)}
      POSTGRES_DB: sonar

    volumes:
      - ./postgresql:/var/lib/postgresql/data

    networks:
      - devops-network

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

networks:
  devops-network:
    name: devops-network
    driver: bridge
