# JavaScript / TypeScript. Key, name, URL and token come from the Jenkins pipeline.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.test.js,**/*.spec.js
# Test files are indexed as tests only, so exclude them from the main sources.
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.test.js,**/*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
