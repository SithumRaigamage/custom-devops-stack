global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container CPU, memory and network for every container on the host.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Jenkins metrics need the "Prometheus metrics" plugin (exposes /prometheus).
  # Until it is installed this target shows as down in Prometheus; nothing else breaks.
  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets: ["jenkins:8080"]

  # SonarQube's /api/monitoring/metrics needs a system passcode header, so it is not
  # scraped by default. To enable, set SONAR_WEB_SYSTEMPASSCODE on the sonarqube
  # container and add an `authorization` block with type: Bearer here.
